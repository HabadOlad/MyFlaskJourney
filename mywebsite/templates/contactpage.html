{% extends "layout.html" %} {% block mainBlock %}
<body class="contact-page">
  <h1>Contact me!</h1>
  <div class="container">
    <form
      action="mailto:habadolad@outlook.com"
      method="post"
      enctype="text/plain">
      <label for="fname">First Name</label>
      <input
        type="text"
        id="fname"
        name="firstname"
        placeholder="Your name.." />

      <label for="lname">Last Name</label>
      <input
        type="text"
        id="lname"
        name="lastname"
        placeholder="Your last name.." />

      <label for="lname">Email Address</label>
      <input
        type="text"
        id="emailaddress"
        name="Email"
        placeholder="yourname@outlook.com" />

      <label for="subject">Subject</label>
      <textarea
        id="subject"
        name="subject"
        placeholder="Write something.."
        style="height: 200px"></textarea>

      <input type="submit" value="Submit" />
    </form>
  </div>
  <footer id="footer"></footer>
  <script src="/static/js/firstWebsiteJS.js" type="text/javascript"></script>
  {% endblock %}
</body>
