{% extends "layout.html" %} {% block mainBlock %}
<div class="blog-page-content">
  <article class="blog-post-detail">
    <h1>{{ post.title }}</h1>

    <div class="post-meta">
      <small>Published: {{ post.date_posted.strftime('%B %d, %Y') }}</small>
    </div>

    <div class="post-content">
      <p>{{ post.content }}</p>
    </div>

    <hr />
    <p><a href="{{ url_for('blogpage') }}">&laquo; Back to Blog</a></p>
  </article>
</div>
{% endblock %}
