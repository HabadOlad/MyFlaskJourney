{% extends "layout.html" %} {% block mainBlock %}
<div class="blog-page-content">
  <article class="blog-post-detail">
    <h1>{{ post.title }}</h1>

    <div class="post-meta">
      <small>Published: {{ post.date_posted.strftime('%B %d, %Y') }}</small>
    </div>

    <div class="post-content">
      <p>{{ post.content }}</p>
    </div>

    <hr />
    <p><a href="{{ url_for('blogpage') }}">&laquo; Back to Blog</a></p>
    <p>
      <a href="{{ url_for('edit_post', post_id=post.id) }}" class="btn-edit"
        >✏️ Edit Post</a
      >

      <form method="POST" action="{{ url_for('delete_post', post_id=post.id) }}" style="display:inline;">
        <button type="submit" onclick="return confirm('Are you sure you want to delete this post?');" class="btn-delete">
          🗑️ Delete Post
        </button>
    </p>
  </article>
</div>
{% endblock %}
