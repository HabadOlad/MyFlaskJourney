{% extends "layout.html" %} {%block mainBlock %}
<div class="blog-page-content">
  <h1>Blog Posts</h1>

  <a href="{{ url_for('new_post') }}" class="btn-create-post"
    >➕ Create New Post</a
  >
  <hr />

  {% for post in posts %}
  <article class="blog-post">
    <h2>
      <a href="{{ url_for('post_detail', post_id=post.id) }}"
        >{{ post.title }}</a
      >
    </h2>

    <div class="post-meta">
      <small>Published: {{ post.date_posted.strftime('%Y-%m-%d') }}</small>
    </div>

    <p>{{ post.content[:200] }}...</p>

    <a href="{{ url_for('post_detail', post_id=post.id) }}" class="read-more"
      >Continue Reading &raquo;</a
    >
  </article>
  <hr />

  {% endfor %}
  <p>© 2025 Habad Olad. All rights reserved.</p>
</div>
{% endblock %}
